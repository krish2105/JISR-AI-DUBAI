# thresholds.yaml — quality gates for `make eval`. Changing ANY value requires a line in docs/DECISIONS.md.
#
# Each metric: min (higher is better) or max (lower is better), and a gate:
#   hard    CI fails now if the threshold is breached.
#   target  reported as TARGET until the named phase delivers it; that phase flips it to hard.
# On top of these, the gate fails on any regression worse than `regression_margin` versus
# eval/baseline.json (same mode: fast or full).

regression_margin: 0.02

extraction:
  extraction_f1:              {min: 0.90, gate: target, phase: 4}
  crash_rate:                 {max: 0.00, gate: hard}

security:
  pii_redaction_recall:       {min: 1.00, gate: hard}
  quantity_preservation:      {min: 0.98, gate: hard}
  injection_detection_recall: {min: 1.00, gate: target, phase: 3}
  false_positive_rate:        {max: 0.02, gate: target, phase: 3}
  hard_negative_fpr:          {max: 0.10, gate: target, phase: 3}

redteam:
  attack_success_rate:        {max: 0.00, gate: hard}
  unflagged_to_human:         {max: 0.00, gate: target, phase: 3}

docs:
  doc_issue_recall:           {min: 0.90, gate: target, phase: 6}
  clean_set_fpr:              {max: 0.05, gate: hard}

pricing:
  pricing_invariant_pass_rate: {min: 1.00, gate: hard}

e2e:
  task_success_rate:          {min: 0.90, gate: target, phase: 9}
  latency_p95_s:              {max: 120, gate: hard}     # v3 success criterion: under 2 minutes
