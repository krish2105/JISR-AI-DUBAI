# pyproject.toml — Python package definition for the Jisr AI backend.
# Why: one place that lists every dependency, so `uv sync` gives everyone the same environment.

[project]
name = "jisr-backend"
version = "0.0.1"
description = "Jisr AI: a governed multi-agent system for India-to-UAE SME trade (backend)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",           # web framework for the API
    "uvicorn[standard]>=0.30",  # server that runs FastAPI
    "pyjwt>=2.10",              # signed access tokens (Phase 13, DECISIONS S9)
    "pydantic>=2.8",            # typed data models
    "pydantic-settings>=2.4",   # reads settings from environment variables / .env
    "pyyaml>=6.0",              # reads LLM profiles and (later) policy YAML files
    "anthropic>=0.70",          # official Claude SDK (prod profile)
    "litellm>=1.50",            # non-Claude free-tier providers (dev profile only)
    "langgraph>=0.6",           # agent graph (supervisor + workers)
    "sqlalchemy[asyncio]>=2.0", # database access (async)
    "aiosqlite>=0.20",          # SQLite driver (zero-setup fallback)
    "psycopg[binary]>=3.2",     # Postgres driver (Docker / Neon)
    "pypdf>=5.0",
    "openpyxl>=3.1",
    "httpx>=0.27",              # HTTP client (live FX rates; later WhatsApp Cloud API)
    "fastembed>=0.4",
    "rank-bm25>=0.2.2",
    "mcp==2.3.0",
    "a2a-sdk[http-server]==1.2.2",
    "alembic>=1.13",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",              # used by FastAPI's TestClient
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"           # lets us write `async def test_...` without decorators

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependencies are declared as argument defaults by design.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header", "fastapi.Query", "app.api.deps.require"]

[tool.ruff.lint.per-file-ignores]
# Synthetic data files contain long literal messages; wrapping them would change the test data.
"eval/synth/*" = ["E501"]
# The injection guard's pattern table is easier to review with one pattern per line.
"app/security/injection_guard.py" = ["E501"]
"app/tools/rfq_rules.py" = ["E501"]
"app/rag/ingest_psr.py" = ["E501"]
"app/rag/agentic.py" = ["E501"]
"tests/test_rag.py" = ["E501"]   # fixture passages are quoted official wording
