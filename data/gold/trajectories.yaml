# trajectories.yaml — 50 end-to-end scenarios: what the agents must DO (path, actions, policies), not just answer.
# Each scenario runs 3 times (pass^3 = all three pass; consistency = identical agent path each time).
#
# input (one of):  enquiry: <id in data/synthetic/enquiries.jsonl> · attack: <id in adversarial.jsonl (test only)>
#                  text: "<message>" · voice: <name in replay/voice/manifest.json>
# setup (optional): kill_switch: true · prior: "<an earlier message from the same buyer>" (buyer memory)
# expect: status, path (agents that must finish, in order), skip (agents that must NOT run), approvals, autonomous,
#         rules_any (policy rules that must fire), rules_none, quote_lines, draft (quote | clarification),
#         flags_any (pricing flags), signals_any (buyer signals), language

