# fly.toml — the hosted Jisr API on Fly.io (deploy from the repo root: `fly deploy`). Steps: docs/DEPLOY.md.
app = "jisr-ai-api"                    # change to your Fly app name
primary_region = "bom"                 # Mumbai: close to both India and the UAE; check `fly platform regions`

[build]
  dockerfile = "deploy/api.Dockerfile"

[env]
  APP_ENV = "prod"
  LLM_PROFILE = "fake"                 # offline deterministic model (no key, no cost). Switch to Claude later:
                                       #   fly secrets set ANTHROPIC_API_KEY=... && fly deploy --env LLM_PROFILE=prod
  FX_PROVIDER = "live"
  DEMO_STEP_DELAY_MS = "300"
  PUBLIC_RUNS_PER_HOUR = "20"          # no-login demo: per visitor IP
  LLM_DAILY_TOKEN_BUDGET = "2000000"   # past this, answers come from the offline model (labelled), never an error
  TRACE_DIR = "/tmp/traces"
  # Secrets (fly secrets set ...): AUTH_SECRET (required), ANTHROPIC_API_KEY, DATABASE_URL (Neon), CORS_ORIGINS, MCP_TOKEN,
  # WHATSAPP_* (optional), MCP_HOST

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1             # keep one warm for judges (models load in ~10 s)

  [[http_service.checks]]
    grace_period = "60s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-2x"               # founder choice 2026-10-10: cheaper; retrieval a few seconds slower
  memory = "4gb"                       # e5-large + reranker on CPU need ~4 GB
